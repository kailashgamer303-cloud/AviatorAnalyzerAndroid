plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kai.aviatoranalyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kai.aviatoranalyzer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
